
su root root

compress

include /etc/logrotate.d

/var/log/messages {
        daily
        rotate 3
        maxsize 256k
        delaycompress
        firstaction
                /usr/bin/jibo-log-client-async --credentials /var/jibo/credentials.json --file /var/log/messages
        endscript
        postrotate
                /usr/bin/killall -HUP rsyslogd
        endscript
}

