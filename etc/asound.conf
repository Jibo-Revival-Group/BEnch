##########################
# Audio service devices
##########################
pcm.services_sink {
    type dsnoop
    ipc_key 456789
    slave
    {
        pcm "hw:Loopback,1,0"
        period_time 8000
        buffer_time 64000
        rate 48000
        channels 1
    }
}

pcm.services_source {
    type dmix
    ipc_key 345678
    ipc_perm 0666
    slave
    {
        pcm "hw:Loopback,0,0"
        period_time 8000
        buffer_time 64000
        rate 48000
        channels 1
    }
}

pcm.as_sink {
    type dsnoop
    ipc_key 567890
    slave
    {
        pcm "hw:Loopback,1,1"
        period_time 8000
        buffer_time 256000
        rate 16000
        channels 2
    }
}

pcm.as_source {
    type dmix
    ipc_key 678901
    slave
    {
        pcm "hw:Loopback,0,1"
        period_time 8000
        buffer_time 64000
        rate 16000
        channels 2
    }
}

##########################
# Other services devices
##########################

pcm.TTSOut {
    type plug
    slave.pcm "tts_faders"
}

pcm.SDKOut {
    type plug
    slave.pcm "sdk_faders"
}

pcm.MediaOut {
    type plug
    slave.pcm "media_faders"
}

pcm.ASRIn {
    type plug
    slave.pcm "asr_in_faders"
    route_policy "copy"
}

pcm.MediaIn {
    type plug
    slave.pcm "media_in_faders"
    route_policy "copy"
}

pcm.SDKIn {
    type plug
    slave.pcm "hw:Dummy"
}

##########################
# Volume controls
##########################
pcm.sub_faders {
    type softvol
    slave {
        pcm "services_source"
    }
    control {
        name "Router In"
        card 2
    }
}

pcm.sub_in_faders {
    type softvol
    slave {
        pcm "as_sink"
    }
    control {
        name "Router Out"
        card 2
        device 1
    }
}

pcm.tts_faders {
    type softvol
    slave {
        pcm "sub_faders"
    }
    control {
        name "TTS Out"
        card 2
    }
}

pcm.sdk_faders {
    type softvol
    slave {
        pcm "sub_faders"
    }
    control {
        name "SDK Out"
        card 2
    }
}

pcm.media_faders{
    type softvol
    slave {
        pcm "sub_faders"
    }
    control {
        name "Media Out"
        card 2
    }
}

pcm.asr_in_faders {
    type softvol
    slave {
        pcm "sub_in_faders"
    }
    control {
        name "ASR In"
        card 2
        device 1
    }
}

pcm.media_in_faders {
    type softvol
    slave {
        pcm "sub_in_faders"
    }
    control {
        name "Media In"
        card 2
        device 1
    }
}

#####################################################3

pcm.!default {
    type asym
    playback.pcm
    {
        type plug
        slave.pcm "sdk_faders"
    }
    capture.pcm
    {
        type plug
        slave.pcm "hw:Dummy"
    }
}

