000, maxParamA: 1000, minParamB: 900, maxParamB: 2800} };
   var currentDS = datasets;
   var currentItem;   
   var format = "Tune";

   var previousPoint = null;
   var errorBar = null;

   function addInfo(key, value) {
    return "<tr><td>"+key+"</td><td><b>"+value+"</b></td></tr>";
   }

   $("#placeholder").bind("plothover", function (event, pos, item, series) {
    var v = $(":radio[name=format]").filter(":checked").val()
    if (item) {
     currentItem = item.series.label;
     if (previousPoint != item.datapoint) {
      previousPoint = item.datapoint;
      errorBar = null;
      var x = item.datapoint[0].toFixed(2),
      y = item.datapoint[1].toFixed(2);
      var d = datasets[item.series.label];
      var cur = currentDS[item.series.label];

      errCol=item.series.color;
      for(i=0; i<item.series.data.length; i++) 
       if(item.series.data[i][0]==item.datapoint[0] &&
          item.series.data[i][1]==item.datapoint[1]) {
            errorBar= item.series.data[i]; break;  
       }
      $("#format").text("");
      var newInfo = "<table>"
      newInfo += addInfo("Series:", item.series.label)
      if (d.format == "1") {
       newInfo += addInfo("ParamA,ParamB:", d.tags[item.dataIndex][0]+","+d.tags[item.dataIndex][1]);
       newInfo += addInfo("False Accepts:", x + '/h')
       newInfo += addInfo("False Rejects:", y + '%')
       newInfo += addInfo("Search Index:", item.dataIndex+1)
       if(d.tags[item.dataIndex][3]>0)
        newInfo += addInfo("Active Noise:", d.tags[item.dataIndex][3])
       else 
        newInfo += addInfo("Active Noise:", "")
       if(d.tags[item.dataIndex][4]>0)  
        newInfo += addInfo("Active Vocab:", d.tags[item.dataIndex][4]);
       else 
        newInfo += addInfo("Active Vocab:", "")
       newInfo += addInfo("Abs Beam:", d.tags[item.dataIndex][2]);
      } else if (d.format == "2") {
       if (cur.abTuning[item.dataIndex].length == 1) {
        var s = ""; 
        if (cur.abTuning[item.dataIndex][0][0] == d.minParamA || cur.abTuning[item.dataIndex][0][0] == d.maxParamA)
         s += "<font color=\"ff0000\">"+cur.abTuning[item.dataIndex][0][0]+"</font>,";
        else
         s += cur.abTuning[item.dataIndex][0][0] + ",";
        if (cur.abTuning[item.dataIndex][0][1] == d.minParamB || cur.abTuning[item.dataIndex][0][1] == d.maxParamB)
         s += "<font color=\"ff0000\">"+cur.abTuning[item.dataIndex][0][1]+"</font>";
        else
         s += cur.abTuning[item.dataIndex][0][1];
        if (d.useC)
         newInfo += addInfo("ParamA,ParamB,ParamC:", s+","+cur.abTuning[item.dataIndex][0][2]);
        else
         newInfo += addInfo("ParamA,ParamB:",s);
       } else {
        var i
        for (i = 0; i < cur.abTuning[item.dataIndex].length; i++) {
         var s = ""; 
         if (cur.abTuning[item.dataIndex][i][0] == d.minParamA || cur.abTuning[item.dataIndex][i][0] == d.maxParamA)
           s += "<font color=\"ff0000\">"+cur.abTuning[item.dataIndex][i][0]+"</font>,";
         else
          s += cur.abTuning[item.dataIndex][i][0] + ",";
         if (cur.abTuning[item.dataIndex][i][1] == d.minParamB || cur.abTuning[item.dataIndex][i][1] == d.maxParamB)
          s += "<font color=\"ff0000\">"+cur.abTuning[item.dataIndex][i][1]+"</font>";
         else
          s += cur.abTuning[item.dataIndex][i][1];
         if (d.useC)
          newInfo += addInfo("A,B,C for " + d.group[i] + ":", s+","+cur.abTuning[item.dataIndex][i][2]);
         else 
          newInfo += addInfo("A,B for " + d.group[i] + ":", s);
        }
       }
       newInfo += addInfo("False Accepts:", x + '/h')
       newInfo += addInfo("False Rejects:", y + '%')
       newInfo += addInfo("Search Index:", item.dataIndex+1)
       if(cur.time[item.dataIndex][1]>0)
        newInfo += addInfo("Active Noise:", cur.time[item.dataIndex][1])
       else 
        newInfo += addInfo("Active Noise:", "")
       if(cur.time[item.dataIndex][2]>0)  
        newInfo += addInfo("Active Vocab:", cur.time[item.dataIndex][2]);
       else 
        newInfo += addInfo("Active Vocab:", "")
       newInfo += addInfo("Abs Beam:", cur.time[item.dataIndex][0]);
      }
      newInfo += "</table>";      
      $("#info").html(newInfo);
     }
    } else {
     previousPoint = null;            
     errorBar=null;
    }
   });

   

   var i=0;
   $.each(datasets, function(key,val) { val.color=i; ++i; });
   var choiceContainer = $("#choices");
   $.each(datasets, function(key,val) {
    choiceContainer.append('<br/><input type="checkbox" name="' + key +
                               '" checked="checked" >' + val.label + '</input>');
   });
   choiceContainer.find("input").click(plotAccordingToChoices);

   function mergePhrases(data) {
    var res = {data: [[]], tags: data.tags, format: data.format, label: data.label};
    if (data.format == "1") {
     res.data = data.data;
    } else if (data.format == "2") {
     res.data = data.dTuning;
     res.time = data.time;
     res.abTuning = data.abTuning;
    }
    return res;
   }

   function plotAccordingToChoices() {
    // should be replaced with a flot.setData/flot.redraw?
    var data = [];
    currentDS = {};
    var axismax = 0;
    var defaultMaxFR = 44.82598607888631;
    var defaultMaxFA = 1.8937499999999998;
    var maxFA = 0;
    var maxFR = 0;
    choiceContainer.find("input:checked").each(function () {
     var key = $(this).attr("name");
     if (key && datasets[key]) {
      currentDS[key] = mergePhrases(datasets[key]);
      data.push(currentDS[key]);
      if(!axismax) {
       for (var i = 0; i < data.length; i++) {
        var series = data[i];
        for (var j = 0; j < series.data.length; j++) {        
          var ds = datasets[series.label];
         var fa = 1.2 * ds.dTuning[j][0];
         var fr = 1.2 * ds.dTuning[j][1];
         if (fa > maxFA) { maxFA = fa; }
         if (fr > maxFR) { maxFR = fr; }
        }
       }
      }
     }
    });
    if (data.length > 0) {
     function raw(plot, ctx) {
      var data = plot.getData();
      var axes = plot.getAxes();
      var offset = plot.getPlotOffset();
      for (var i = 0; i < data.length; i++) {
       var series = data[i];
       for (var j = 0; j < series.data.length; j++) {        
        var ds = datasets[series.label];
        var bad = 0;
        for (var k = 0; k < ds.abTuning[j].length; k++) {
          var paramA = ds.abTuning[j][k][0];
         var paramB = ds.abTuning[j][k][1];
         if (paramA == ds.minParamA || paramA == ds.maxParamA || paramB == ds.minParamB || paramB == ds.maxParamB) {
          bad = 1;
          break;
         }
        }
        if (bad) {
         var color = "#ff0000";
         var d = (series.data[j]);
         var x = offset.left + axes.xaxis.p2c(d[0]);
         var y = offset.top + axes.yaxis.p2c(d[1]);
         var r = 4;
         ctx.lineWidth = 2;
         ctx.beginPath();
         ctx.arc(x,y,r,0,Math.PI*2,true);
         ctx.closePath();            
         ctx.fillStyle = color;
         ctx.fill();
        }
       }    
      }
     };

     if (maxFA == 0) {maxFA = defaultMaxFA;}
     if (maxFR == 0) {maxFR = defaultMaxFR;}

     var flot = $.plot($("#placeholder"), data, {
      lines: { show: true }, 
      points: { show: true }, 
      selection: { mode: "xy" }, 
      grid: { hoverable: true, clickable: true }, 
      yaxis: { min: 0, max: maxFR, ticks: 10 }, 
      xaxis: { min: 0, max: maxFA, ticks: 10 },
      hooks: {draw : [raw] }
     });
     var axes=flot.getAxes();
     xp2c=axes.xaxis.p2c;  yp2c=axes.yaxis.p2c;
     flot.hooks.drawOverlay.push(function (plot, ctx) {
        if(errorBar==null || errorBar.length == 2) return;
        ctx.save();
        ctx.strokeStyle="rgba(10,10,10,0.5)";
        ctx.lineWidth="1";
        ctx.lineJoin="round";
        var off=plot.getPlotOffset();
        ctx.translate(off.left,off.top);
        ctx.beginPath();
        ctx.moveTo(xp2c(errorBar[0]-errorBar[2]),yp2c(errorBar[1]));
        ctx.lineTo(xp2c(errorBar[0]+errorBar[2]),yp2c(errorBar[1]));
        ctx.moveTo(xp2c(errorBar[0]-errorBar[2]),yp2c(errorBar[1])-5);
        ctx.lineTo(xp2c(errorBar[0]-errorBar[2]),yp2c(errorBar[1])+5);
        ctx.moveTo(xp2c(errorBar[0]+errorBar[2]),yp2c(errorBar[1])-5);
        ctx.lineTo(xp2c(errorBar[0]+errorBar[2]),yp2c(errorBar[1])+5);
        ctx.moveTo(xp2c(errorBar[0]),yp2c(errorBar[1]-errorBar[3]));
        ctx.lineTo(xp2c(errorBar[0]),yp2c(errorBar[1]+errorBar[3]));
        ctx.moveTo(xp2c(errorBar[0])-5,yp2c(errorBar[1]-errorBar[3]));
        ctx.lineTo(xp2c(errorBar[0])+5,yp2c(errorBar[1]-errorBar[3]));
        ctx.moveTo(xp2c(errorBar[0])-5,yp2c(errorBar[1]+errorBar[3]));
        ctx.lineTo(xp2c(errorBar[0])+5,yp2c(errorBar[1]+errorBar[3]));
        ctx.stroke();
        ctx.restore();
     });
    }
   }
   plotAccordingToChoices();
