   function mergePhrases(data) {
    var res = {data: [[]], tags: data.tags, format: data.format, label: data.label};
    if (data.format == "1") {
     res.data = data.data;
    } else if (data.format == "2") {
     res.data = data.dTuning;
     res.time = data.time;
     res.abTuning = data.abTuning;
    }
    return res;
   }

         var y = offset.top + axes.yaxis.p2c(d[1]);
         var r = 4;
         ctx.lineWidth = 2;
         ctx.beginPath();
         ctx.arc(x,y,r,0,Math.PI*2,true);
         ctx.closePath();            
         ctx.fillStyle = color;
         ctx.fill();
        }
       }    
      }
     };

     if (maxFA == 0) {maxFA = defaultMaxFA;}
     if (maxFR == 0) {maxFR = defaultMaxFR;}

     var flot = $.plot($("#placeholder"), data, {
      lines: { show: true }, 
      points: { show: true }, 
      selection: { mode: "xy" }, 
      grid: { hoverable: true, clickable: true }, 
      yaxis: { min: 0, max: maxFR, ticks: 10 }, 
      xaxis: { min: 0, max: maxFA, ticks: 10 },
      hooks: {draw : [raw] }
     });
     var axes=flot.getAxes();
     xp2c=axes.xaxis.p2c;  yp2c=axes.yaxis.p2c;
     flot.hooks.drawOverlay.push(function (plot, ctx) {
        if(errorBar==null || errorBar.length == 2) return;
        ctx.save();
        ctx.strokeStyle="rgba(10,10,10,0.5)";
        ctx.lineWidth="1";
        ctx.lineJoin="round";
        var off=plot.getPlotOffset();
        ctx.translate(off.left,off.top);
        ctx.beginPath();
        ctx.moveTo(xp2c(errorBar[0]-errorBar[2]),yp2c(errorBar[1]));
        ctx.lineTo(xp2c(errorBar[0]+errorBar[2]),yp2c(errorBar[1]));
        ctx.moveTo(xp2c(errorBar[0]-errorBar[2]),yp2c(errorBar[1])-5);
        ctx.lineTo(xp2c(errorBar[0]-errorBar[2]),yp2c(errorBar[1])+5);
        ctx.moveTo(xp2c(errorBar[0]+errorBar[2]),yp2c(errorBar[1])-5);
        ctx.lineTo(xp2c(errorBar[0]+errorBar[2]),yp2c(errorBar[1])+5);
        ctx.moveTo(xp2c(errorBar[0]),yp2c(errorBar[1]-errorBar[3]));
        ctx.lineTo(xp2c(errorBar[0]),yp2c(errorBar[1]+errorBar[3]));
        ctx.moveTo(xp2c(errorBar[0])-5,yp2c(errorBar[1]-errorBar[3]));
        ctx.lineTo(xp2c(errorBar[0])+5,yp2c(errorBar[1]-errorBar[3]));
        ctx.moveTo(xp2c(errorBar[0])-5,yp2c(errorBar[1]+errorBar[3]));
        ctx.lineTo(xp2c(errorBar[0])+5,yp2c(errorBar[1]+errorBar[3]));
        ctx.stroke();
        ctx.restore();
     });
    }
   }
   plotAccordingToChoices();
  });
 </script>
