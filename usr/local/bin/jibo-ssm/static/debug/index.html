<html>
<head>
    <title>Service remote debugging</title>

    <script>
        function onLoad() {
            var tabs_list_request = new XMLHttpRequest();
            tabs_list_request.open("GET", "/debug", true);
            tabs_list_request.onreadystatechange = onReady;
            tabs_list_request.send();
        }

        function onReady() {
            if (this.readyState == 4 && this.status == 200) {
                if (this.response != null) {
                    var responseJSON = JSON.parse(this.response);
                    appendItem(responseJSON);
                }
            }
        }

        function appendItem(item_object) {
            var frontend_ref;
            if (item_object.devtoolsFrontendUrl) {
                frontend_ref = document.createElement("a");
                frontend_ref.href = item_object.devtoolsFrontendUrl;
                frontend_ref.title = item_object.title;
            } 
            else {
                frontend_ref = document.createElement("div");
                frontend_ref.title = "The tab already has active debugging session";
            }

            var text = document.createElement("div");
            if (item_object.title) {
                text.innerText = item_object.title;
            }
            else {
                text.innerText = "(untitled tab)";
            }
            text.style.cssText = "background-image:url(" + item_object.faviconUrl + ")";
            frontend_ref.appendChild(text);

            var item = document.createElement("p");
            item.appendChild(frontend_ref);

            document.getElementById("items").appendChild(item);
        }

    </script>
</head>

<body onload='onLoad()'>
    <div id='caption'>Inspectable Debugger</div>
    <div id='items'></div>
<!-- 5x1: shared dark look (and, inside BEacon's Services console, safety prompts) for Jibo's service pages, served by
     BEacon; last in the page so it wins over the page's own styles, and the original look stays if BEacon is down -->
<script>document.write('<link rel="stylesheet" href="//' + location.hostname + ':8123/service-pages.css"><script src="//' + location.hostname + ':8123/service-pages.js"><\/script>');</script>
</body>

</html>
