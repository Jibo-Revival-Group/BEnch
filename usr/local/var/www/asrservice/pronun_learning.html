function connectAsr() {
 
    socket.onopen = function() {
        console.log("Touch state socket open!");
    };
    socket.onmessage = function(msg) {
        console.log("Got message!!");
		//console.log(msg.data);	
        var data = JSON.parse(msg.data);
        var data_str = JSON.stringify(data, null, 4);
        data_str = data_str.concat("\n");
        data_str = data_str.concat(wsMsgLog);
        wsMsgLog = data_str;
        //state.appendTouchState(data);
        console.log(data);
        //$("#asr").html($("<p>").text(JSON.stringify(data, null, 2)));
        $("#asrState").val(wsMsgLog);

        //state.appendTouchState(data);
        //console.log(data);
        //$("#asr").html($("<p>").text(JSON.stringify(data, null, 2)));
        //$("#asrState").val(JSON.stringify(data, null, 4));
    };
    socket.onclose = function() {
        console.log("Asr state socket close!");
        setTimeout(function() { connectAsr(); }, 3000);
    };
}

function sendSocketMsg() {
    console.log("Sending socket msg");
    socket.send('10');
}

var data = {task: "default", action: "default"};




function packTTSSettings() {
    str1='<speak> Your name is <phoneme ph="';
      
    str2='">xxx </phoneme> <break size="1.5"/> right?</speak>';
      
    data.timeout = parseFloat("100000");
    data.duration_stretch = parseFloat("1");
    data.pitch = parseFloat("0.42");
    data.pitchBandwidth = parseFloat("0.25");
    data.locale = "en-us";
    data.voice = "griffin";
    
    data.prompt=str1.concat($("#word_phoneme").val(),str2)
    
    data.mode = "ssml";
    data.outputMode = "stream";
    return JSON.stringify(data);
}

function packPronunSettings() {
    data.word = $("#word").val();
    data.nbest = "10";
    data.task_id = "0";
    data.action = $("#action_spec_dropdown").val();
    data.audio_source_id = "0";
    return JSON.stringify(data);
}



function packTaskSettings() {
    data.task = $("#task_spec").val();
    data.task_id = $("#task_id").val();
    data.action = "init_and_start";
    data.audio_source_id = $("#audio_source_id").val();
    return JSON.stringify(data);
}

function packInitTaskSettings() {
    data.task = $("#task_spec").val();
    data.task_id = $("#task_id").val();
    data.action = "init";
    data.audio_source_id = $("#audio_source_id").val();
    return JSON.stringify(data);
}

function packStartTaskSettings() {
    data.task = "";
    data.task_id = $("#stop_task_id").val();
    data.action = "start";
    data.audio_source_id = "";
    return JSON.stringify(data);
}

function packStopTaskSettings() {
    data.task = "";
    data.action = "stop";
    data.task_id = $("#stop_task_id").val();
    data.audio_source_id = "";
    return JSON.stringify(data);
}

function packClearTaskSettings() {
    data.task = "";
    data.action = "clear";
    data.task_id = $("#stop_task_id").val();
    data.audio_source_id = "";
    return JSON.stringify(data);
}

var audio_source_data = {action: "default", audio_source_id:"default_id", 
    audio_source:"default_source"}

function packAudioSourceCommand() {
    audio_source_data.action = "start";
    audio_source_data.audio_source_id = $("#audio_source_id2").val();
    audio_source_data.wav_files = JSON.parse($("#wav_files").val());
    audio_source_data.audio_source = $("#audio_source").val();
    return JSON.stringify(audio_source_data);
}

function packStopAudioSourceCommand() {
    audio_source_data.action = "stop";
    audio_source_data.audio_source_id = $("#audio_source_id3").val();
    audio_source_data.wav_files = [];
    audio_source_data.audio_source = "default_source";
    return JSON.stringify(audio_source_data);
}
