function connectAsr() {
 
    socket.onopen = function() {
        console.log("ASR message socket open!");
    };
    socket.onmessage = function(msg) {
        console.log("Got message!!");
        var data = JSON.parse(msg.data);
        var data_str = JSON.stringify(data, null, 4);
        data_str = data_str.concat("\n");
        data_str = data_str.concat(wsMsgLog);
        wsMsgLog = data_str;
        //state.appendTouchState(data);
        console.log(data.content);
        //$("#asr").html($("<p>").text(JSON.stringify(data, null, 2)));
        $("#asrState").val(wsMsgLog);

      
    };
    socket.onclose = function() {
        console.log("Asr message socket close!");
        setTimeout(function() { connectAsr(); }, 3000);
    };
}
	
function isEmpty(obj) {

function connectSpkrID() {
	socket.onopen = function() {
		console.log("Touch state socket open!");
	};
	socket.onmessage = function(msg) {
    
    console.log("Got message from Spkr-ID");
    var data = JSON.parse(msg.data);
    
    var resultjson = {};
    var data_str = JSON.stringify(data, null, 4);
    data_str = data_str.concat("\n");
    data_str = data_str.concat(wsMsgLog);
    wsMsgLog = data_str;
    //console.log(data["speaker_id_record"]);
    var data2 = JSON.stringify(data["speaker_id_record"], null, 4);
    //console.log(data2);
    //var prop = JSON.stringify(data["speaker_id_record"]["speaker_id"], null, 4);
    //var prop_list_spk = JSON.stringify(data["speaker_id_record"]["utt_status"], null, 4);
    //console.log(data["speaker_id_record"]["speaker_id"]);
    
    if(data["speaker_id_record"]["utt_status"]=='LISTING-TD-SPEAKERS'){
      var user_id = [];
      var temp_id;
      for( var i=0; i < data["speaker_id_record"]["speaker_id"].length; i++ ){
        temp_id = data["speaker_id_record"]["speaker_id"][i];
        user_id[i] = temp_id["id"];
        //console.log(user_id[i]);
      }
      console.log("List speakers found!");
      $("#enrolledusers").val(user_id);
      enrolledspeakers = user_id;
    } 
       
    if(data["simple_recog_name"] == "Speaker ID TD" && data["task_id"] == "task1"){
      console.log("SID Result found!");
      
      var result_str = data["speaker_id_record"]["speaker_id"][0]["id"] + "\n";
      result_str = result_str + "score:" + data["speaker_id_record"]["speaker_id"][0]["score"] + "\n";
      result_str = result_str + "Hypothesis:" + data["speaker_id_record"]["utt_status"]; 
      resultjson['exp_name'] =  $("#experimentname").val(); 
      resultjson['true_speaker'] =  $("#firstname").val().toLowerCase(); 
      resultjson['age'] =  $("#age").val(); 
      resultjson['gender'] = getRadioVal( document.getElementById('demoForm'), 'sex' );
        
      resultjson['taskid'] = data["task_id"];
      resultjson['speaker_ids'] = data["speaker_id_record"]["speaker_id"][0]["id"].toLowerCase();
      resultjson['score'] = data["speaker_id_record"]["speaker_id"][0]["score"];
      resultjson['hypothesis'] = data["speaker_id_record"]["utt_status"];
      resultjson['enrolledusers'] = enrolledspeakers; 
      resultjson['human_timestamp'] = data["human_timestamp"];

      postResult(resultjson);
      resultjson = {};
      if ( (data["speaker_id_record"]["utt_status"]) == "ACCEPTED" && ($("#firstname").val().toLowerCase() == data["speaker_id_record"]["speaker_id"][0]["id"].toLowerCase())) {
         var ele = document.getElementById("result");
         ele.style.color = "lime";  
      } else {
         var ele = document.getElementById("result");
         ele.style.color = "red";             
      }
      $("#result").val(result_str); 
      $("#identify").attr('disabled', true);
      $("#enroll").attr('disabled', true);
      
      clearSPK();
	  sleep(800).then(()=>{
      identifySPK()});
    }

    if(data["simple_recog_name"] == "Speaker Enroll TD" && data["task_id"] == "task1"){
      console.log("Enroll response received!");
      
      var result_str = data["speaker_id_record"]["utt_status"]; 
      $("#result").val(result_str); 
      $("#enroll").attr('disabled', true);
      $("#identify").attr('disabled', true);
      
      if (data["speaker_id_record"]["utt_status"] == "ENROLLMENT-DONE") {
        enrollment_status = (data["speaker_id_record"]["utt_status"] == "ENROLLMENT-DONE"); 
        alert("You are enrolled!");
        ListEnrolledUsers();
        $("#enroll").attr('disabled', false);
      }
      else if (data["speaker_id_record"]["utt_status"] == "ENROLLMENT-STARTED") {
        console.log("Enrollment started: waiting for new ws message");
        $("#result").val(""); 
      }
      else if (data["speaker_id_record"]["utt_status"] != "ENROLLMENT-DONE"){
        clearSPK();
        sleep(800).then(()=>{
        enrollSPK(2)});
      } 
    }

        //$("#asr").html($("<p>").text(JSON.stringify(data, null, 2)));
        $("#asrState").val(wsMsgLog);
	};
	socket.onclose = function() {
		console.log("Spkr-ID state socket close!");
		setTimeout(function() {connectSpkrID(); }, 3000);
	};
}

function getRadioVal(form, name) {
    var val;
    // get list of radio buttons with specified name
    var radios = form.elements[name];
    console.log(radios);
    // loop through list of radio buttons
    for (var i=0, len=radios.length; i<len; i++) {
        if ( radios[i].checked ) { // radio checked?
            val = radios[i].value; // if so, hold its value in val
            break; // and break out of for loop
        }
    }
    return val; // return value of checked radio or undefined if none checked
}

function makeid() {
    var text = "";
    var possible = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

    for( var i=0; i < 16; i++ )
        text += possible.charAt(Math.floor(Math.random() * possible.length));

    return text;
}
