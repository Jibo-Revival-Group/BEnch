var host = window.location.host;
var socket = new WebSocket("ws://"+host+"/port");
var socket_simple = new WebSocket("ws://"+host+"/simple_port");
var wsMsgLog = ""
var wsSimpleMsgLog = ""


function connectAsr() {
 
    socket.onopen = function() {
        console.log("ASR message socket open!");
    };
    socket.onmessage = function(msg) {
        console.log("Got message!!");
        var data = JSON.parse(msg.data);
        var data_str = JSON.stringify(data, null, 4);
        data_str = data_str.concat("\n");
        data_str = data_str.concat(wsMsgLog);
        wsMsgLog = data_str;
        //state.appendTouchState(data);
        console.log(data.content);
        //$("#asr").html($("<p>").text(JSON.stringify(data, null, 2)));
        $("#asrState").val(wsMsgLog);
    };
    socket.onclose = function() {
        console.log("Asr message socket close!");
        setTimeout(function() { connectAsr(); }, 3000);
    };
}


function connectSimpleAsr() {
 
    socket_simple.onopen = function() {
        console.log("ASR simple message socket open!");
    };
    socket_simple.onmessage = function(msg) {
        console.log("Got simple message!!");
        var data_simple = JSON.parse(msg.data);
        var data_simple_str = JSON.stringify(data_simple, null, 4);
        data_simple_str = data_simple_str.concat("\n");
        data_simple_str = data_simple_str.concat(wsSimpleMsgLog);
        wsSimpleMsgLog = data_simple_str;
        //state.appendTouchState(data);
        console.log(data_simple.content);
        //$("#asr").html($("<p>").text(JSON.stringify(data, null, 2)));
        $("#asrStateSimple").val(wsSimpleMsgLog);
    };
    socket_simple.onclose = function() {
        console.log("Asr message simple socket close!");
        setTimeout(function() { connectSimpleAsr(); }, 3000);
    };
}


function sendSocketMsg() {
    console.log("Sending socket msg");
    socket.send('10');
}
