<!DOCTYPE html>
<html>
<head>
<script src="js/jquery-2.1.3.js"></script>
<script src="js/jquery.flot.min.js"></script>
<script src="js/test.js"></script>
<style type="text/css">
table {
    position: relative;
}
table td > div {
    margin-left: auto;
}
table td > div.slider-container {
    overflow: auto;
    height: calc(100% - 60px);
}
table td > div.output-picker-container {
    height: 20px;
}
td {
    white-space: nowrap;
}
input[type=range][orient=vertical] {
    writing-mode: bt-lr; /* IE */
    -webkit-appearance: slider-vertical; /* WebKit */
    width: 8px;
    height: 100%;
    padding: 0 5px;
}
.slider-inner-container {
    display: inline-block;
    height: calc(100% - 8px);
}
.slider-label {
    top: -20px;
    position: absolute;
    opacity: 0;
    transition: opacity 0.4s;
    border: 2px solid #bbb;
    padding: 3px;
    background-color: #000;
    color: #fff;
    pointer-events: none;
}
.slider-inner-container:hover .slider-label {
    opacity: 1;
}
button {
    margin-right: 5px;
}
button.on {
    box-shadow: 0 0 1px 2px rgba(0, 150, 0, 0.5);
}
</style>
<meta charset="UTF-8">
<title>Cameras</title>
</head>
<body>

<button id="buttonConnect">Connect</button>
<button id="buttonDisonnect">Disconnect</button>
<button id="buttonApply">Apply</button>
<label><input type="checkbox" id="yuvCheckbox" /> YUV Histograms</label>
<hr/>

<div id="divCameras"></div>

</body>
</html>
